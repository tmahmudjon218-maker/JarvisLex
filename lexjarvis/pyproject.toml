[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lexjarvis"
version = "0.1.0"
description = "Open-source Uzbek-language legal study tutor powered by Claude. Answers only from sources you provide."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["anthropic>=0.40"]
keywords = ["legal", "education", "uzbek", "claude", "dtm", "tutor"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
lexjarvis = "lexjarvis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
